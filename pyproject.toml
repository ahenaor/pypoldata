[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypoldata"
version = "0.1.2"
description = "Acceso reproducible a datasets abiertos para Ciencia Política y Ciencias Sociales."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Henao Ruiz" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "geopandas>=1.0",
    "pyarrow>=12.0",
    "requests>=2.31",
    "platformdirs>=4.0"
]

[project.urls]
Homepage = "https://github.com/ahenaor/pypoldata"
Repository = "https://github.com/ahenaor/pypoldata"
Issues = "https://github.com/ahenaor/pypoldata/issues"

# Configuración explícita del src layout para Hatchling
[tool.hatch.build.targets.wheel]
packages = ["src/pypoldata"]

[tool.hatch.build.targets.wheel.sources]
"src/pypoldata" = "pypoldata"

[tool.hatch.build.targets.sdist]
include = [
    "/src/pypoldata",
    "/src/pypoldata/catalog.json",
]