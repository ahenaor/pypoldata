[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypoldata"
version = "0.1.0"
description = "Reproducible access to data for Political Science."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/ahenaor/pypoldata"